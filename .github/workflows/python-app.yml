name: Radar Ambiental

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  executar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar Radar Ambiental
        run: python radar.py
